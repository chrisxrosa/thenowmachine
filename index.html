const PROCESS = [

  { n: 'P-02', title: 'Casting', body: 'New talent, or someone already on your team. Whichever it is, that becomes the person your buyer relates to.' },

  { n: 'P-06', title: 'Optimization', body: 'We learn from the data and feed it back into the engine. One operator is responsible for the outcome, and every month you get a report with the optimization plan attached.' }
];

const CYCLE = PROCESS;

function Process() {
  const wheelRef = React.useRef(null);
  const headRef = React.useRef(null);
  const [p, setP] = React.useState(0);
  const [R, setR] = React.useState(196);
  const [still, setStill] = React.useState(false);
  const [peek, setPeek] = React.useState(null);
  const timer = React.useRef(null);
  React.useEffect(() => {
    const fit = () => setR(Math.min(560, window.innerWidth * 0.92) * 0.35);
    fit();
    window.addEventListener('resize', fit);
    setStill(window.matchMedia('(prefers-reduced-motion:reduce)').matches);
    return () => { window.removeEventListener('resize', fit); clearTimeout(timer.current); };
  }, []);
  /* Progress runs between two anchors: p = 0 the moment the wheel is fully
     visible (its bottom clears the viewport bottom), p = 1 just as the section
     title slides up under the fixed nav. On short viewports those two points can
     collapse, so a minimum spin distance is enforced by starting earlier — the
     end anchor is preserved either way. */
  useScroll(() => {
    const el = wheelRef.current, head = headRef.current;
    if (!el || !head) return;
    const r = el.getBoundingClientRect();
    if (!r.height) return;
    const y = window.scrollY;
    const to = (head.getBoundingClientRect().top + y) - 96;
    let from = (r.bottom + y) - window.innerHeight;
    if (to - from < 220) from = to - 220;
    setP(clamp((y - from) / Math.max(to - from, 1), 0, 1));
  });
  /* Positive rotation is clockwise. Base angles run negative so that turning
     clockwise brings the six nodes to 12 o'clock in array order. The sweep is
     300deg, not 360 — that lands and holds on Optimization, the sixth node.
     A full 360 would carry it back around to Audit. */
  const turn = still ? 0 : p * 300;
  /* floor, not round — the step switches at the instant a node reaches the top,
     not when it is halfway there. */
  const spun = Math.floor(turn / 60) % 6;
  const shown = peek !== null ? peek : spun;
  const tap = i => {
    if (i === spun) return;
    clearTimeout(timer.current);
    setPeek(i);
    timer.current = setTimeout(() => setPeek(null), 2600);
  };
  return (
    <section id="process" data-screen-label="How it runs" className="proc-sec">
      <Frame>
        <div ref={headRef} className="rev"><DisplayHeading size={1} tone="inverse">How it runs</DisplayHeading></div>

          <div className="wheel-ring" />
          {CYCLE.map((s, i) => {
            const ang = -i * 60 + turn;
            return (
              <div key={s.n} className={'wheel-node' + (i === shown ? ' on' : '')}
                role="button" tabIndex={0}
                onClick={() => tap(i)}
                onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(i); } }}
                style={{ transform: `translate(-50%,-50%) rotate(${ang}deg) translate(0,${-R}px) rotate(${-ang}deg)` }}>
                <MonoLabel className="id" tone="muted">{s.n}</MonoLabel>
                <h3>{s.title}</h3>
              </div>
            );
          })}
          <div className="wheel-core">
            <p>{CYCLE[shown].body}</p>
          </div>
        </div>
        {/* Below 900px the wheel is hidden and these read as a plain stack,
            so nothing depends on the rotation to be legible. */}
        <div className="proc-cycle-list">
          {CYCLE.map(s => (
            <article key={s.n} className="cap proc-step">

              <h3>{s.title}</h3>
              <p style={{ margin: 0 }}>{s.body}</p>

      </Frame>
    </section>
  );
}

function Work() {
  const [hov, setHov] = React.useState(-1);
  const [below, setBelow] = React.useState(false);
  const [cw, setCw] = React.useState(240);
  const rail = React.useRef(null);
  React.useEffect(() => {
    const fit = () => {
      const avail = Math.min(window.innerWidth, 1680) - 48 - GAP * (WORK.length - 1);
      const maxByW = avail / (WORK.length + 0.34);
      const maxByH = ((window.innerHeight - 280) * 4 / 5) / 1.34;
      setCw(Math.round(Math.max(170, Math.min(340, maxByW, maxByH))));
    };
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, []);
  React.useEffect(() => {
    let raf = null;
    const onMove = e => {
      if (raf !== null) return;
      const y = e.clientY;
      raf = requestAnimationFrame(() => {
        raf = null;
        const el = rail.current; if (!el) return;
        setBelow(y > el.getBoundingClientRect().bottom);
      });
    };
    window.addEventListener('mousemove', onMove, { passive: true });
    return () => { if (raf !== null) cancelAnimationFrame(raf); window.removeEventListener('mousemove', onMove); };
  }, []);
  const vids = React.useRef({});
  const play = id => { const v = vids.current[id]; if (v) v.play().catch(() => {}); };
  const stop = id => { const v = vids.current[id]; if (v) { v.pause(); v.currentTime = 0; } };
  const bigIdx = hov >= 0 ? hov : (below ? -1 : 0);
  React.useEffect(() => { WORK.forEach((w, n) => (n === bigIdx ? play(w.id) : stop(w.id))); }, [bigIdx]);
  const bigW = Math.round(cw * 1.34);
  return (
    <section id="work" data-screen-label="Selected work" className="work-sec">
      <Frame style={{ width: '100%' }}>
        <DisplayHeading size={1}>Selected work</DisplayHeading>
      </Frame>

        <div className="wtrack">
          {WORK.map((w, n) => (
            <WorkTile key={w.id} w={w} w1={n === bigIdx ? bigW : cw} big={n === bigIdx}

              onLeave={() => setHov(h => (h === n ? -1 : h))}
              vref={el => { vids.current[w.id] = el; }} />
          ))}
        </div>
      </div>
    </section>
  );
}

          </div>

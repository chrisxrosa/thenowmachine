      shrinks, letting the photo's track drift out of step with the photo.

/* ── 3. Reel handoff — video grows edge-to-edge, holds while "What we run" arrives

function ReelHandoff() {

      const c = document.getElementById('capabilities');

      raf = null;
      const holder = stage.parentElement;
      const pinEl = document.getElementById('caps-pin');
      const target = document.getElementById('cap-media-target');
      const fill = document.getElementById('cap-media-fill');

      const vh = window.innerHeight, vw = window.innerWidth;

           into the thumbnail as the page scrolls. No full-bleed, no sticky hold. */

        const t0 = target.getBoundingClientRect();

        const to = (t0.top + sy + t0.height / 2) - vh * 0.55;
        const p = clamp((sy - from) / Math.max(to - from, 1), 0, 1);
        if (cue) cue.style.opacity = String(clamp((0.95 - p) / 0.25, 0, 1));
        if (caps0) caps0.style.setProperty('--reveal', String(p));
        const heroCopy0 = document.querySelector('.hero-lockup');
        if (heroCopy0) heroCopy0.style.opacity = String(clamp(1 - p * 1.6, 0, 1));
        if (hr.top >= pin && p <= 0.001) return reset();
        const st = { left: hr.left, width: hr.width, height: hr.height, top: Math.max(hr.top, pin) };
        stage.style.position = 'fixed';
        stage.style.left = (st.left + (t0.left - st.left) * p) + 'px';
        stage.style.top = (st.top + (t0.top - st.top) * p) + 'px';
        stage.style.width = (st.width + (t0.width - st.width) * p) + 'px';
        stage.style.height = (st.height + (t0.height - st.height) * p) + 'px';
        stage.style.borderRadius = R + 'px';
        stage.style.zIndex = 30;
        stage.style.opacity = p > 0.94 ? String(Math.max(0, (1 - p) / 0.06)) : '1';

        return;

      const pinTop = pinEl.getBoundingClientRect().top + sy;
      const growFrom = hr.top + sy - (vh - hr.height) / 2;

         layout — so the video visibly snaps to full-bleed and back down quickly,
         instead of tracking however tall the hero content happens to be. */
      const growLen = vh * 0.3;
      const shrinkLen = vh * 0.15; /* must finish inside .caps-spacer (22vh) or the section releases mid-shrink */

         background underneath would show through as it shrinks. Once grow finishes
         early (fast), the video just sits full-bleed and static for whatever short
         gap remains until pinTop, then shrink fires immediately. */
      const sp = clamp((sy - pinTop) / shrinkLen, 0, 1);
      if (cue) cue.style.opacity = String(clamp((0.95 - sp) / 0.25, 0, 1));
      const caps = document.getElementById('capabilities');

      const full = { left: 0, top: 0, width: vw, height: vh };
      let box, rad;
      if (sp > 0) {

          top: full.top + (tgt.top - full.top) * sp,
          width: full.width + (tgt.width - full.width) * sp,
          height: full.height + (tgt.height - full.height) * sp

      } else {

          left: base.left + (full.left - base.left) * g,
          top: base.top + (full.top - base.top) * g,
          width: base.width + (full.width - base.width) * g,
          height: base.height + (full.height - base.height) * g
        };
        rad = R * (1 - g);
      }

      stage.style.left = box.left + 'px';
      stage.style.top = box.top + 'px';
      stage.style.width = box.width + 'px';
      stage.style.height = box.height + 'px';
      stage.style.borderRadius = rad + 'px';
      stage.style.zIndex = 30;
      stage.style.opacity = sp > 0.94 ? String(Math.max(0, (1 - sp) / 0.06)) : '1';

    };

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    tick();
    return () => { window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onScroll); };
  }, []);

}

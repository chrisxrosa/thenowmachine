const GEAR = (() => {
  const N = 9, root = 148, out = 175, c = 200;
  const pt = (r, a) => { const t = (a - 90) * Math.PI / 180; return (c + Math.cos(t) * r).toFixed(1) + ',' + (c + Math.sin(t) * r).toFixed(1); };
  let d = '';
  for (let i = 0; i < N; i++) {
    const s = i * 360 / N, w = 360 / N;
    d += (i ? 'L' : 'M') + pt(root, s + w * 0.06) + 'L' + pt(out, s + w * 0.2) + 'L' + pt(out, s + w * 0.5) + 'L' + pt(root, s + w * 0.64);
  }
  return d + 'Z';
})();

function Process() {
  const wheelRef = React.useRef(null);
  const headRef = React.useRef(null);
  const coreRef = React.useRef(null);
  const lastY = React.useRef(0);
  const [prog, setProg] = React.useState({ stage: -1, rot: 0 });
  const [still, setStill] = React.useState(false);
  const [peek, setPeek] = React.useState(null);
  const [shownIn, setShownIn] = React.useState(false);
  const secRef = React.useRef(null);
  const lock = React.useRef(0);
  React.useEffect(() => {
    const el = secRef.current; if (!el) return;
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { setShownIn(true); io.disconnect(); } }, { rootMargin: '0px 0px -12% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  React.useEffect(() => {
    const jump = () => { setPeek(0); lock.current = Date.now() + 1400; };
    window.addEventListener('tnm:process-jump', jump);
    return () => window.removeEventListener('tnm:process-jump', jump);
  }, []);
  React.useEffect(() => {
    lastY.current = window.scrollY;
    setStill(window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  }, []);

  useScroll(() => {
    const y = window.scrollY;
    if (Date.now() < lock.current) { lastY.current = y; }
    else if (Math.abs(y - lastY.current) > 2) { lastY.current = y; if (peek !== null) setPeek(null); }
    const el = wheelRef.current, head = headRef.current, core = coreRef.current;
    if (!el || !head || !core) return;
    const r = el.getBoundingClientRect();
    if (!r.height) return;
    const vh = window.innerHeight;
    const a0 = (core.getBoundingClientRect().bottom + y) - vh;
    const a1 = (r.top + r.height * 0.96 + y) - vh;
    const end = Math.max((head.getBoundingClientRect().top + y) - 96, a1 + 420);
    let stage = -1;
    if (y >= a1) stage = 1 + Math.min(5, Math.floor(((y - a1) / Math.max(end - a1, 1)) * 6));
    else if (y >= a0) stage = 0;
    const rot = Math.max(0, (y - a0) / Math.max(end - a0, 1));
    setProg(v => (v.stage === stage && Math.abs(v.rot - rot) < 0.002) ? v : { stage, rot });
  });
  const stage = prog.stage;
  const lit = peek !== null || stage >= 0;
  const shown = peek !== null ? peek : Math.max(stage, 0);
  const turn = still ? 0 : -(prog.rot * 360 * 0.5);
  const tap = i => { if (i !== stage || peek !== null) setPeek(i); };
  const rv = shownIn ? 'rev in' : 'rev';
  const keys = (i) => e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(i); } };

  return (
    <section id="process" data-screen-label="How it runs" className="proc-sec" ref={secRef}>
      <Frame style={{ width: '100%' }}>
        <div ref={headRef} className={rv}><DisplayHeading size={1} tone="inverse">How it runs</DisplayHeading></div>
        <div className="proc-stage">
          {/* Top Row: One Time */}
          <div className={'proc-row-block ' + rv} style={{ transitionDelay: '60ms' }}>
            <div className="proc-row-items">
              {PROCESS.slice(0, 3).map((st, i) => (
                <div key={st.n} className={rv} style={{ transitionDelay: `${110 + i * 55}ms` }}>
                  <div className={'pitem' + (lit && i === shown ? ' on' : '')}
                    role="button" tabIndex={0} onClick={() => tap(i)} onKeyDown={keys(i)}>
                    <MonoLabel className="id" tone="muted">{st.n}</MonoLabel>
                    <h3>{st.title}</h3>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Middle: Wheel Gear */}
          <div className={'wheel ' + rv} ref={wheelRef} style={{ transitionDelay: '200ms' }}>
            <svg className={'wheel-gear' + (lit ? ' on' : '')} viewBox="0 0 400 400" aria-hidden="true" style={{ transform: `translate(-50%,-50%) rotate(${turn}deg)` }}>
              <path d={GEAR} fill="none" stroke="currentColor" strokeWidth="1.25" strokeLinejoin="round" />
            </svg>
            <div className="wheel-core" ref={coreRef}>
              <span className={'band-label' + (lit ? ' on' : '')} style={{ display: 'inline-block', marginBottom: 'var(--sp-2)' }}>
                {shown < 3 ? 'One time' : 'Repeated'}
              </span>
              <p>{PROCESS[shown].body}</p>
            </div>
          </div>

          {/* Bottom Row: Repeated */}
          <div className={'proc-row-block repeated-row ' + rv} style={{ transitionDelay: '265ms' }}>
            <div className="proc-row-items">
              {PROCESS.slice(3).map((st, idx) => {
                const i = idx + 3;
                return (
                  <div key={st.n} className={rv} style={{ transitionDelay: `${110 + i * 55}ms` }}>
                    <div className={'pitem' + (lit && i === shown ? ' on' : '')}
                      role="button" tabIndex={0} onClick={() => tap(i)} onKeyDown={keys(i)}>
                      <MonoLabel className="id" tone="muted">{st.n}</MonoLabel>
                      <h3>{st.title}</h3>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
        <div className="proc-cycle-list">
          {PROCESS.map(s => (
            <article key={s.n} className="cap proc-step">
              <MonoLabel className="id step-n" tone="muted">{s.n}</MonoLabel>
              <h3>{s.title}</h3>
              <p style={{ margin: 0 }}>{s.body}</p>
            </article>
          ))}
        </div>
      </Frame>
    </section>
  );
}
